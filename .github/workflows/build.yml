name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 所有 gradle 命令都在 android/ 目录下执行
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 安装 Android SDK 命令行工具并自动接受许可
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform 34 + build-tools)
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 直接安装 Gradle 8.9（不依赖 gradle-wrapper.jar，最稳妥）
      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -d "$HOME/gradle" /tmp/gradle-8.9-bin.zip
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
          rm -f /tmp/gradle-8.9-bin.zip

      # 修复（L9）：缓存 Gradle 依赖，显著缩短构建时间
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/build.gradle.kts', 'android/app/build.gradle.kts', 'android/settings.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 修复（L10）：质量门禁——lint 与单元测试
      - name: Lint
        run: gradle lintDebug --no-daemon

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: schedule-assistant-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ===== 发布签名（可选）：仅在仓库配置了 KEYSTORE_BASE64 等 Secrets 时执行 =====
      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release-key.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: schedule-assistant-apk-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ===== 发行版：推送 v* 标签时，用 CI 构建产物创建 GitHub Release（云端完成，无需本地下载）=====
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: schedule-assistant-apk
          path: apk

      - name: Rename APK with version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mv apk/app-debug.apk "schedule-assistant-v${VER}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "## 日程助手 v${VER}" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "基于 CI 构建产物（debug 签名，可直接安装测试）。" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### 功能" >> /tmp/release-notes.md
          echo "- 周课表（单/双周循环）+ 调课/调休/单日自定义" >> /tmp/release-notes.md
          echo "- 今日安排：倒计时、课程/日程时间线" >> /tmp/release-notes.md
          echo "- 工作日程：系统通知 + 声音提醒（提前量可自定义）" >> /tmp/release-notes.md
          echo "- 学期周次自动计算（开学日至周日为第 1 周）" >> /tmp/release-notes.md
          echo "- 背景图（URL）、主题、JSON 导入导出备份" >> /tmp/release-notes.md
          echo "- 完全离线、本地存储，无网络权限依赖" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### 安装" >> /tmp/release-notes.md
          echo "下载 APK 后直接安装；首次安装需允许“安装未知来源应用”。" >> /tmp/release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            "schedule-assistant-v${VER}.apk" \
            --title "日程助手 v${VER}" \
            --notes-file /tmp/release-notes.md
